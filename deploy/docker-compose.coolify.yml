x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:?set DB_HOST}:5432/${POSTGRES_DB:?set POSTGRES_DB}
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TEMPO_USER_EMAIL: ${TEMPO_USER_EMAIL:?set TEMPO_USER_EMAIL}
      TEMPO_USER_NAME: ${TEMPO_USER_NAME:?set TEMPO_USER_NAME}
      TEMPO_USER_PASSWORD_HASH: ${TEMPO_USER_PASSWORD_HASH:?set TEMPO_USER_PASSWORD_HASH}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    networks:
      - web
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/auth/csrf || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    logging: *logging

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile.coolify
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    logging: *logging

networks:
  web: {}
  coolify:
    external: true
