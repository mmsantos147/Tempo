spring:
  application:
    name: tempo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tempo}
    username: ${DB_USER:tempo}
    password: ${DB_PASSWORD:tempo}

  web:
    locale: en
    locale-resolver: fixed

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        secure: true
        same-site: strict

tempo:
  initial-user:
    email: ${TEMPO_USER_EMAIL:}
    name: ${TEMPO_USER_NAME:}
    password-hash: ${TEMPO_USER_PASSWORD_HASH:}
